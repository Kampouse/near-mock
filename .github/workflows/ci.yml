name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Zero-warning gate (crate is warning-free; keep it that way)
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --all-targets
      - name: Unit tests
        run: cargo test
      - name: Verify suite (68 checks, hermetic)
        run: ./scripts/verify.sh
